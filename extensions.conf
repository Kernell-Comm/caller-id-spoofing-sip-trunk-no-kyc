[spoof-out]
; Dial with custom caller id:  Dial(SIP/18005551212@spoof-out/15551234567)
exten => _X.,1,NoOp(Spoofing call to ${EXTEN})
 same => n,Set(CALLERID(num)=${CLI})          ; set your spoofed number
 same => n,Set(CALLERID(name)=${CLI_NAME})    ; optional name
 same => n,Set(CALLERID(all)=${CLI_NAME} <${CLI}>)
 same => n,SipAddHeader(P-Asserted-Identity: <sip:${CLI}@sip.sip24.cc>)
 same => n,SipAddHeader(Remote-Party-ID: <sip:${CLI}@sip.sip24.cc>;party=calling;privacy=off;screen=no)
 same => n,Dial(SIP/sip24/${EXTEN},60,tT)
 same => n,Hangup()

; Convenience:  SpoofCLI(number,cli,name)
exten => spoof,1,Answer()
 same => n,Read(DEST,please-enter-destination)
 same => n,Read(CLI,please-enter-caller-id)
 same => n,Set(CALLERID(num)=${CLI})
 same => n,Dial(SIP/sip24/${DEST})
 same => n,Hangup()
